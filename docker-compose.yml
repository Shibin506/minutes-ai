services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MINUTES_MODEL: ${MINUTES_MODEL:-claude-opus-5-5}
    volumes:
      - minutes-data:/data

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  minutes-data:

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MINUTES_MODEL: ${MINUTES_MODEL:-claude-opus-5-5}
      MINUTES_PROVIDER: ${MINUTES_PROVIDER:-auto}
      MINUTES_RETRIEVAL: ${MINUTES_RETRIEVAL:-hybrid+rerank}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MINUTES_GEMINI_MODEL: ${MINUTES_GEMINI_MODEL:-gemini-3.5-flash}
    volumes:
      - minutes-data:/data

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  minutes-data:

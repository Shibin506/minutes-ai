[project]
name = "minutes-ai"
version = "0.1.0"
description = "AI meeting copilot: transcripts in, summaries, action items and cited answers out."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=2.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "numpy>=2.0",
]

[project.scripts]
minutes-mcp = "minutes.mcp_server:main"

[project.optional-dependencies]
audio = ["faster-whisper>=1.0"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "mcp>=2.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["minutes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
# The storyline the extra sample meetings were written from: long prose lines.
"scripts/generate_samples.py" = ["E501"]
